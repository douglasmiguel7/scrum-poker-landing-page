<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" role="img" aria-labelledby="t d">
  <title id="t">Cartas reveladas no Estime Ai</title>
  <desc id="d">O resultado de uma votação: o voto de cada pessoa, quantos votos cada carta recebeu, o total de 36 pontos, a média de 9 e o botão "Iniciar nova votação".</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #262626; font-size: 14px; }
    .h { font-size: 28px; font-weight: 600; }
    .white { fill: #ffffff; }
  </style>
  <defs>
    <rect id="card" width="40" height="64" rx="2" fill="#1890ff"/>
  </defs>

  <rect x="0.5" y="0.5" width="639" height="559" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <rect x="150.5" y="24.5" width="339" height="511" fill="#ffffff" stroke="#f0f0f0"/>

  <!-- result -->
  <text x="320" y="82" text-anchor="middle" class="h">Resultado</text>
  <g>
    <text x="226" y="116" text-anchor="middle">Ana</text><use href="#card" x="206" y="124"/><text x="226" y="161" text-anchor="middle" class="white">8</text>
    <text x="288" y="116" text-anchor="middle">Bruno</text><use href="#card" x="268" y="124"/><text x="288" y="161" text-anchor="middle" class="white">8</text>
    <text x="350" y="116" text-anchor="middle">Carla</text><use href="#card" x="330" y="124"/><text x="350" y="161" text-anchor="middle" class="white">4</text>
    <text x="412" y="116" text-anchor="middle">Diego</text><use href="#card" x="392" y="124"/><text x="412" y="161" text-anchor="middle" class="white">16</text>
  </g>

  <!-- analysis -->
  <text x="320" y="240" text-anchor="middle" class="h">Análise</text>
  <g>
    <text x="257" y="274" text-anchor="middle">2 votos</text><use href="#card" x="237" y="282"/><text x="257" y="319" text-anchor="middle" class="white">8</text>
    <text x="320" y="274" text-anchor="middle">1 voto</text><use href="#card" x="300" y="282"/><text x="320" y="319" text-anchor="middle" class="white">4</text>
    <text x="383" y="274" text-anchor="middle">1 voto</text><use href="#card" x="363" y="282"/><text x="383" y="319" text-anchor="middle" class="white">16</text>
  </g>

  <!-- total and average -->
  <text x="263" y="398" text-anchor="middle" class="h">Total</text>
  <text x="263" y="440" text-anchor="middle" class="h">36</text>
  <text x="377" y="398" text-anchor="middle" class="h">Média</text>
  <text x="377" y="440" text-anchor="middle" class="h">9</text>

  <rect x="242" y="472" width="156" height="32" rx="2" fill="#1890ff"/>
  <text x="320" y="493" text-anchor="middle" class="white">Iniciar nova votação</text>
</svg>
